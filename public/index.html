<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robes de mariée & accessoires</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<style>
:root{--creme:#EEE4DA;--sand:#D8C4AC;--rose:#C8A49F;--wine:#4D0E13;--mute:#6B4A48;--line:rgba(77,14,19,.2)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
[hidden]{display:none!important}
body{margin:0;background:var(--creme);color:var(--wine);font:400 17px/1.65 'Josefin Sans',system-ui,sans-serif}
h1,h2{font-weight:300;margin:0;line-height:1.08;letter-spacing:.05em;text-transform:uppercase}
h3{font-weight:400;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;position:sticky;top:0;background:rgba(238,228,218,.92);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase}
.cartbtn{background:none;border:1px solid var(--wine);border-radius:99px;padding:8px 20px;color:var(--wine)}
.cartbtn b{background:var(--wine);color:var(--creme);border-radius:99px;padding:1px 9px;margin-left:8px;font-weight:400}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:5vw;align-items:center;padding:8vh 5vw 10vh;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.6rem)}
.hero p{max-width:34ch;color:var(--mute);margin:24px 0 32px;font-size:1.15rem}
.btn{display:inline-block;background:var(--wine);color:var(--creme);border:0;padding:14px 34px;border-radius:99px;text-decoration:none;letter-spacing:.04em}
.visual{position:relative;max-width:380px;margin-left:auto;width:100%}
.arch{aspect-ratio:3/4;border-radius:999px 999px 0 0;background:linear-gradient(175deg,var(--sand),var(--rose))}
.badge{position:absolute;left:-14%;bottom:9%;background:var(--wine);color:var(--creme);padding:14px 28px;border-radius:99px;font-size:.98rem}
.band{background:rgba(216,196,172,.55);padding:9vh 0 11vh}
.shop{max-width:1200px;margin:auto;padding:0 5vw}
.shop h2{font-size:2rem;margin-bottom:26px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:38px}
.tabs button{border:1px solid var(--wine);background:none;border-radius:99px;padding:7px 22px;color:var(--wine)}
.tabs button[aria-pressed=true]{background:var(--wine);color:var(--creme)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:40px 28px}
.ph{position:relative;aspect-ratio:3/4;border-radius:999px 999px 0 0;overflow:hidden;background:linear-gradient(175deg,var(--creme),var(--rose));display:grid;place-items:center;color:rgba(77,14,19,.45);font-size:2.4rem}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item h3{font-size:1.3rem;margin:18px 0 2px}
.item .cat{color:var(--mute);font-size:.9rem}
.item p{color:var(--mute);font-size:.98rem;margin:6px 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:1.2rem;font-weight:600}
.add{border:0;background:var(--wine);color:var(--creme);border-radius:99px;padding:8px 20px}
.add:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--mute)}
footer{background:var(--wine);color:var(--creme);padding:34px 5vw;text-align:center;letter-spacing:.06em}
aside{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--creme);box-shadow:-14px 0 40px rgba(77,14,19,.25);transform:translateX(105%);transition:transform .3s;z-index:9;display:flex;flex-direction:column}
aside.open{transform:none}
aside header{position:static;background:var(--creme)}
#lines{flex:1;overflow:auto;padding:10px 24px}
.line{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--wine);background:none;color:var(--wine)}
.qty span{margin:0 8px}
.foot{padding:20px 24px;border-top:1px solid var(--line);display:grid;gap:12px;background:rgba(216,196,172,.4)}
.foot input{padding:12px 20px;border:1px solid var(--line);border-radius:99px;font:inherit;background:#fff8}
.foot .btn{text-align:center}
.foot .btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--mute);text-decoration:underline}
@media(max-width:760px){.hero{grid-template-columns:1fr}.visual{margin:0 auto;max-width:280px;order:-1}.badge{left:-6%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="logo" id="shopname"></div><button class="cartbtn" id="open">Panier<b id="count">0</b></button></header>
<section class="hero">
  <div><h1>Pour le plus beau jour de votre vie</h1><p id="tagline"></p><a class="btn" href="#catalogue">Découvrir la collection</a></div>
  <div class="visual" aria-hidden="true"><div class="arch"></div><div class="badge">Commande simple sur WhatsApp</div></div>
</section>
<div class="band"><main class="shop" id="catalogue">
  <h2>La collection</h2>
  <div class="tabs" id="tabs" role="group" aria-label="Catégories"></div>
  <div class="grid" id="grid"></div>
</main></div>
<footer id="foot"></footer>
<aside id="drawer" aria-label="Panier">
  <header><h2 style="font-size:1.5rem">Votre panier</h2><button class="link" id="close">Fermer</button></header>
  <div id="lines"></div>
  <div class="foot">
    <div class="row"><span>Total</span><span class="price" id="total"></span></div>
    <input id="client" placeholder="Votre prénom (facultatif)" autocomplete="given-name">
    <button class="btn" id="send" disabled>Valider sur WhatsApp</button>
    <button class="link" id="clear">Vider le panier</button>
  </div>
</aside>
<script>
let D, cat = 'Tout', cart = {};
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fr-FR').format(n) + ' ' + D.settings.currency;
const save = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };
const byId = id => D.products.find(p => p.id === id);

function drawCatalog() {
  $('#tabs').innerHTML = ['Tout', ...D.categories].map(c => `<button aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const list = D.products.filter(p => cat === 'Tout' || p.category === cat);
  $('#grid').innerHTML = list.length ? list.map(p => `<article class="item">
    <div class="ph">✦${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ''}</div>
    <h3>${esc(p.name)}</h3><div class="cat">${esc(p.category)}</div><p>${esc(p.description)}</p>
    <div class="row"><span class="price">${fmt(p.price)}</span>
    <button class="add" data-add="${esc(p.id)}" ${p.available === false ? 'disabled' : ''}>${p.available === false ? 'Indisponible' : 'Ajouter'}</button></div>
  </article>`).join('') : '<p class="empty">Aucun article dans cette catégorie pour le moment.</p>';
}
function drawCart() {
  const ids = Object.keys(cart).filter(id => byId(id));
  let total = 0, n = 0;
  $('#lines').innerHTML = ids.length ? ids.map(id => {
    const p = byId(id), q = cart[id]; total += p.price * q; n += q;
    return `<div class="line"><div><div>${esc(p.name)}</div><small class="empty">${fmt(p.price)}</small></div>
    <div class="qty"><button data-dec="${esc(id)}" aria-label="Retirer un">−</button><span>${q}</span><button data-inc="${esc(id)}" aria-label="Ajouter un">+</button></div></div>`;
  }).join('') : '<p class="empty" style="padding:20px 0">Votre panier est vide. Ajoutez une robe ou un accessoire pour commencer.</p>';
  $('#total').textContent = fmt(total); $('#count').textContent = n; $('#send').disabled = !ids.length;
}
function change(id, d) { cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; save(); drawCart(); }
function order() {
  const ids = Object.keys(cart).filter(id => byId(id)); if (!ids.length) return;
  let total = 0;
  const lines = ids.map(id => { const p = byId(id), q = cart[id]; total += p.price * q; return `• ${q} x ${p.name} — ${fmt(p.price * q)}`; });
  const who = $('#client').value.trim();
  const msg = `Bonjour${who ? ', je suis ' + who : ''}, je souhaite commander :\n${lines.join('\n')}\n\nTotal : ${fmt(total)}`;
  const num = String(D.settings.whatsapp).replace(/\D/g, '');
  location.href = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.cat) { cat = t.dataset.cat; drawCatalog(); }
  if (t.dataset.add) { change(t.dataset.add, 1); $('#drawer').classList.add('open'); }
  if (t.dataset.inc) change(t.dataset.inc, 1);
  if (t.dataset.dec) change(t.dataset.dec, -1);
});
$('#open').onclick = () => $('#drawer').classList.add('open');
$('#close').onclick = () => $('#drawer').classList.remove('open');
$('#clear').onclick = () => { cart = {}; save(); drawCart(); };
$('#send').onclick = order;
async function load() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const [s, c, p] = await Promise.all([sb.from('settings').select('*').eq('id', 1).single(), sb.from('categories').select('*').order('position').order('id'), sb.from('products').select('*').order('created_at', { ascending: false })]);
  if (s.error || c.error || p.error) throw new Error('load');
  const names = Object.fromEntries(c.data.map(x => [x.id, x.name]));
  return { settings: s.data, categories: c.data.map(x => x.name), products: p.data.map(x => ({ ...x, id: String(x.id), category: names[x.category_id] || '' })) };
}
load().then(d => {
  D = d; const s = d.settings;
  document.title = s.name + ' — ' + s.tagline;
  $('#shopname').textContent = s.name; $('#tagline').textContent = s.tagline; $('#foot').textContent = '© ' + new Date().getFullYear() + ' ' + s.name;
  drawCatalog(); drawCart();
}).catch(() => { $('#grid').innerHTML = '<p class="empty">Impossible de charger la collection. Rechargez la page.</p>'; });
</script>
</body>
</html>
