<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robes de mariée & accessoires</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<style>
:root{--bg:#F5F4F6;--ink:#2A1F2D;--mute:#6E6472;--line:#DDD8E0;--gold:#A8844A;--rose:#E8D9DB;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;position:sticky;top:0;background:rgba(245,244,246,.92);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-family:'Bodoni Moda',serif;font-size:1.35rem}
.cartbtn{background:none;border:1px solid var(--ink);border-radius:99px;padding:8px 18px;color:var(--ink)}
.cartbtn b{background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;font-weight:400}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:5vw;align-items:center;padding:7vh 5vw 8vh;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(2.6rem,6.5vw,5.4rem);letter-spacing:-.02em}
.hero h1 em{color:var(--gold)}
.hero p{max-width:34ch;color:var(--mute);margin:22px 0 30px;font-size:1.1rem}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;padding:14px 30px;border-radius:99px;text-decoration:none}
.arch{aspect-ratio:3/4;border-radius:999px 999px 0 0;background:linear-gradient(170deg,var(--rose),#cfc3d6);display:grid;place-items:center;font-family:'Bodoni Moda',serif;font-size:7rem;color:#fff;max-width:380px;margin-left:auto;width:100%}
.shop{max-width:1200px;margin:auto;padding:0 5vw 10vh}
.shop h2{font-size:2.2rem;margin-bottom:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 18px;color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:34px 26px}
.ph{position:relative;aspect-ratio:3/4;border-radius:999px 999px 0 0;overflow:hidden;background:linear-gradient(170deg,var(--rose),#d4cbdc);display:grid;place-items:center;color:#fff;font:2.6rem 'Bodoni Moda',serif}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item h3{font-size:1.25rem;margin:16px 0 2px}
.item .cat{color:var(--mute);font-size:.85rem}
.item p{color:var(--mute);font-size:.92rem;margin:6px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-family:'Bodoni Moda',serif;font-size:1.2rem}
.add{border:1px solid var(--ink);background:none;border-radius:99px;padding:6px 16px;color:var(--ink)}
.add:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--mute)}
footer{border-top:1px solid var(--line);padding:30px 5vw;text-align:center;color:var(--mute)}
aside{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;box-shadow:-12px 0 40px rgba(42,31,45,.15);transform:translateX(105%);transition:transform .3s;z-index:9;display:flex;flex-direction:column}
aside.open{transform:none}
aside header{position:static;background:#fff}
#lines{flex:1;overflow:auto;padding:10px 24px}
.line{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none}
.qty span{margin:0 8px}
.foot{padding:20px 24px;border-top:1px solid var(--line);display:grid;gap:12px}
.foot input{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.foot .btn{background:#1f8f55;text-align:center}
.foot .btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--mute);text-decoration:underline}
@media(max-width:760px){.hero{grid-template-columns:1fr}.arch{margin:0 auto;max-width:260px;font-size:4.5rem;order:-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="logo" id="shopname"></div><button class="cartbtn" id="open">Panier<b id="count">0</b></button></header>
<section class="hero">
  <div><h1>Pour le plus beau <em>jour</em> de votre vie</h1><p id="tagline"></p><a class="btn" href="#catalogue">Découvrir la collection</a></div>
  <div class="arch" aria-hidden="true">✦</div>
</section>
<main class="shop" id="catalogue">
  <h2>La collection</h2>
  <div class="tabs" id="tabs" role="group" aria-label="Catégories"></div>
  <div class="grid" id="grid"></div>
</main>
<footer id="foot"></footer>
<aside id="drawer" aria-label="Panier">
  <header><h2 style="font-size:1.5rem">Votre panier</h2><button class="link" id="close">Fermer</button></header>
  <div id="lines"></div>
  <div class="foot">
    <div class="row"><span>Total</span><span class="price" id="total"></span></div>
    <input id="client" placeholder="Votre prénom (facultatif)" autocomplete="given-name">
    <button class="btn" id="send" disabled>Valider sur WhatsApp</button>
    <button class="link" id="clear">Vider le panier</button>
  </div>
</aside>
<script>
let D, cat = 'Tout', cart = {};
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fr-FR').format(n) + ' ' + D.settings.currency;
const save = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };
const byId = id => D.products.find(p => p.id === id);

function drawCatalog() {
  $('#tabs').innerHTML = ['Tout', ...D.categories].map(c => `<button aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const list = D.products.filter(p => cat === 'Tout' || p.category === cat);
  $('#grid').innerHTML = list.length ? list.map(p => `<article class="item">
    <div class="ph">✦${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ''}</div>
    <h3>${esc(p.name)}</h3><div class="cat">${esc(p.category)}</div><p>${esc(p.description)}</p>
    <div class="row"><span class="price">${fmt(p.price)}</span>
    <button class="add" data-add="${esc(p.id)}" ${p.available === false ? 'disabled' : ''}>${p.available === false ? 'Indisponible' : 'Ajouter'}</button></div>
  </article>`).join('') : '<p class="empty">Aucun article dans cette catégorie pour le moment.</p>';
}
function drawCart() {
  const ids = Object.keys(cart).filter(id => byId(id));
  let total = 0, n = 0;
  $('#lines').innerHTML = ids.length ? ids.map(id => {
    const p = byId(id), q = cart[id]; total += p.price * q; n += q;
    return `<div class="line"><div><div>${esc(p.name)}</div><small class="empty">${fmt(p.price)}</small></div>
    <div class="qty"><button data-dec="${esc(id)}" aria-label="Retirer un">−</button><span>${q}</span><button data-inc="${esc(id)}" aria-label="Ajouter un">+</button></div></div>`;
  }).join('') : '<p class="empty" style="padding:20px 0">Votre panier est vide. Ajoutez une robe ou un accessoire pour commencer.</p>';
  $('#total').textContent = fmt(total); $('#count').textContent = n; $('#send').disabled = !ids.length;
}
function change(id, d) { cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; save(); drawCart(); }
function order() {
  const ids = Object.keys(cart).filter(id => byId(id)); if (!ids.length) return;
  let total = 0;
  const lines = ids.map(id => { const p = byId(id), q = cart[id]; total += p.price * q; return `• ${q} x ${p.name} — ${fmt(p.price * q)}`; });
  const who = $('#client').value.trim();
  const msg = `Bonjour${who ? ', je suis ' + who : ''}, je souhaite commander :\n${lines.join('\n')}\n\nTotal : ${fmt(total)}`;
  const num = String(D.settings.whatsapp).replace(/\D/g, '');
  location.href = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.cat) { cat = t.dataset.cat; drawCatalog(); }
  if (t.dataset.add) { change(t.dataset.add, 1); $('#drawer').classList.add('open'); }
  if (t.dataset.inc) change(t.dataset.inc, 1);
  if (t.dataset.dec) change(t.dataset.dec, -1);
});
$('#open').onclick = () => $('#drawer').classList.add('open');
$('#close').onclick = () => $('#drawer').classList.remove('open');
$('#clear').onclick = () => { cart = {}; save(); drawCart(); };
$('#send').onclick = order;
async function load() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const [s, c, p] = await Promise.all([sb.from('settings').select('*').eq('id', 1).single(), sb.from('categories').select('*').order('position').order('id'), sb.from('products').select('*').order('created_at', { ascending: false })]);
  if (s.error || c.error || p.error) throw new Error('load');
  const names = Object.fromEntries(c.data.map(x => [x.id, x.name]));
  return { settings: s.data, categories: c.data.map(x => x.name), products: p.data.map(x => ({ ...x, id: String(x.id), category: names[x.category_id] || '' })) };
}
load().then(d => {
  D = d; const s = d.settings;
  document.title = s.name + ' — ' + s.tagline;
  $('#shopname').textContent = s.name; $('#tagline').textContent = s.tagline; $('#foot').textContent = '© ' + new Date().getFullYear() + ' ' + s.name;
  drawCatalog(); drawCart();
}).catch(() => { $('#grid').innerHTML = '<p class="empty">Impossible de charger la collection. Rechargez la page.</p>'; });
</script>
</body>
</html>
